<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shield/Emblem Subtle Shadow -->
    <filter id="gkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>

    <!-- Inner Book Gradient -->
    <linearGradient id="gkBookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#gkBgGrad)" filter="url(#gkShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="4" />

  <!-- Subtle Emblem Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Top: Graduation Cap (Mortarboard) - Prestige & Education -->
  <g id="mortarboard">
    <!-- Cap Rhombus Diamond -->
    <polygon points="256,108 384,164 256,220 128,164" fill="url(#gkGoldGrad)" />
    <!-- Cap Underneath Skullcap Arc -->
    <path d="M184,190 L184,236 C184,272 328,272 328,236 L328,190 Z" fill="#b45309" fill-opacity="0.9" />
    <path d="M192,194 L192,232 C192,260 320,260 320,232 L320,194 Z" fill="url(#gkGoldGrad)" />
    <!-- Tassel Button & Cord -->
    <circle cx="256" cy="164" r="7" fill="#ffffff" />
    <path d="M256,164 Q330,176 348,224" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <!-- Tassel Fringe Ribbon -->
    <polygon points="344,222 352,222 356,252 340,252" fill="url(#gkGoldGrad)" />
  </g>

  <!-- Bottom: Open Book of Knowledge & Schedule Grid Foundation -->
  <g id="openBook">
    <!-- Spine Base Accent -->
    <path d="M256,400 L256,290" stroke="url(#gkGoldGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Left Open Page -->
    <path d="M256,296 C216,280 148,284 116,298 C110,300 106,306 106,312 L106,386 C106,394 114,400 122,398 C150,386 214,382 256,398 Z" fill="url(#gkBookGrad)" />
    <!-- Right Open Page -->
    <path d="M256,296 C296,280 364,284 396,298 C402,300 406,306 406,312 L406,386 C406,394 398,400 390,398 C362,386 298,382 256,398 Z" fill="url(#gkBookGrad)" />

    <!-- Clean Lines on Left Page (Representing Schedule Rows) -->
    <line x1="140" y1="324" x2="232" y2="314" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="140" y1="344" x2="232" y2="334" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="140" y1="364" x2="216" y2="356" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />

    <!-- Clean Lines on Right Page (Representing Schedule Rows) -->
    <line x1="280" y1="314" x2="372" y2="324" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="280" y1="334" x2="372" y2="344" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="296" y1="356" x2="372" y2="364" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
